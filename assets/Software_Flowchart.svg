<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1480" viewBox="0 0 1800 1480">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f4f66"/>
    </marker>
    <style>
      .title { font: 700 52px Arial, sans-serif; fill: #17212b; }
      .subtitle { font: 400 23px Arial, sans-serif; fill: #5f6d7a; }
      .laneTitle { font: 700 27px Arial, sans-serif; fill: #17212b; }
      .boxText { font: 700 21px Arial, sans-serif; fill: #17212b; }
      .smallText { font: 400 18px Arial, sans-serif; fill: #17212b; }
      .tinyText { font: 400 16px Arial, sans-serif; fill: #4d5b66; }
      .noteText { font: 700 18px Arial, sans-serif; fill: #1f5e82; }
      .lane { fill: #f6f9fc; stroke: #c8d4df; stroke-width: 2; rx: 18; ry: 18; }
      .box { stroke: #1f4f66; stroke-width: 2.5; rx: 10; ry: 10; }
      .round { stroke: #1f4f66; stroke-width: 2.5; }
      .line { stroke: #1f4f66; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .returnLine { stroke: #73828f; stroke-width: 2.5; fill: none; marker-end: url(#arrow); stroke-dasharray: 8 7; }
      .dataBox { fill: #eef7f4; stroke: #94c8b5; stroke-width: 2; rx: 12; ry: 12; }
      .label { font: 700 16px Arial, sans-serif; fill: #1f4f66; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1480" fill="#ffffff"/>
  <text x="70" y="76" class="title">Digital Piano Software Flowchart</text>
  <text x="70" y="112" class="subtitle">Main code, button EXTI interrupt, and SysTick sound interrupt are shown as separate flows.</text>

  <rect x="50" y="155" width="650" height="1045" class="lane"/>
  <rect x="745" y="155" width="490" height="1045" class="lane"/>
  <rect x="1280" y="155" width="470" height="1045" class="lane"/>

  <text x="375" y="202" text-anchor="middle" class="laneTitle">Main Program Flow</text>
  <text x="990" y="202" text-anchor="middle" class="laneTitle">Button EXTI Interrupt Flow</text>
  <text x="1515" y="202" text-anchor="middle" class="laneTitle">SysTick Interrupt Flow</text>

  <!-- Main program flow -->
  <ellipse cx="375" cy="270" rx="135" ry="43" fill="#dbeaf5" class="round"/>
  <text x="375" y="277" text-anchor="middle" class="boxText">Start / Reset</text>

  <path d="M375 313 L375 350" class="line"/>
  <rect x="160" y="350" width="430" height="98" fill="#ffffff" class="box"/>
  <text x="375" y="384" text-anchor="middle" class="boxText">Initialize Peripherals</text>
  <text x="375" y="414" text-anchor="middle" class="smallText">GPIO outputs, EXTI inputs, ADC, SysTick</text>
  <text x="375" y="438" text-anchor="middle" class="tinyText">enable global interrupts</text>

  <path d="M375 448 L375 486" class="line"/>
  <rect x="205" y="486" width="340" height="82" fill="#e4f0e8" class="box"/>
  <text x="375" y="520" text-anchor="middle" class="boxText">Enter while(1)</text>
  <text x="375" y="548" text-anchor="middle" class="smallText">wait using __WFI()</text>

  <path d="M375 568 L375 615" class="line"/>
  <polygon points="375,615 560,690 375,765 190,690" fill="#f4e5c7" class="box"/>
  <text x="375" y="680" text-anchor="middle" class="boxText">20 ms passed?</text>
  <text x="375" y="710" text-anchor="middle" class="smallText">use SysTick_Millis()</text>

  <path d="M560 690 L640 690 L640 830 L595 830" class="line"/>
  <text x="604" y="672" text-anchor="middle" class="label">No</text>

  <path d="M375 765 L375 810" class="line"/>
  <text x="398" y="792" class="label">Yes</text>

  <rect x="150" y="810" width="450" height="105" fill="#ffffff" class="box"/>
  <text x="375" y="847" text-anchor="middle" class="boxText">Read ADC Knobs</text>
  <text x="375" y="877" text-anchor="middle" class="smallText">PA0 volume, PA1 octave</text>
  <text x="375" y="900" text-anchor="middle" class="tinyText">average samples for smoother readings</text>

  <path d="M375 915 L375 960" class="line"/>
  <polygon points="375,960 560,1035 375,1110 190,1035" fill="#dbeaf5" class="box"/>
  <text x="375" y="1025" text-anchor="middle" class="boxText">Button active?</text>
  <text x="375" y="1055" text-anchor="middle" class="smallText">Get_Active_Note()</text>

  <path d="M190 1035 L105 1035 L105 1128 L185 1128" class="line"/>
  <text x="135" y="1018" text-anchor="middle" class="label">No</text>
  <rect x="185" y="1115" width="245" height="78" fill="#f1dedb" class="box"/>
  <text x="308" y="1148" text-anchor="middle" class="boxText">Stop_Tone()</text>
  <text x="308" y="1175" text-anchor="middle" class="smallText">speaker pins off</text>

  <path d="M560 1035 L640 1035 L640 1128 L610 1128" class="line"/>
  <text x="603" y="1018" text-anchor="middle" class="label">Yes</text>
  <rect x="465" y="1115" width="225" height="78" fill="#dbeaf5" class="box"/>
  <text x="578" y="1148" text-anchor="middle" class="boxText">Play_Tone()</text>
  <text x="578" y="1175" text-anchor="middle" class="smallText">load chord + octave</text>

  <path d="M308 1115 C245 1000, 250 760, 320 732" class="returnLine"/>
  <path d="M578 1115 C630 1005, 620 770, 500 728" class="returnLine"/>

  <!-- Button interrupt flow -->
  <ellipse cx="990" cy="270" rx="115" ry="42" fill="#dbeaf5" class="round"/>
  <text x="990" y="277" text-anchor="middle" class="boxText">EXTI Entry</text>

  <path d="M990 312 L990 350" class="line"/>
  <rect x="825" y="350" width="330" height="82" fill="#ffffff" class="box"/>
  <text x="990" y="384" text-anchor="middle" class="boxText">Button Edge Occurs</text>
  <text x="990" y="412" text-anchor="middle" class="smallText">PC0, PC1, PC2, or PC3</text>

  <path d="M990 432 L990 470" class="line"/>
  <rect x="845" y="470" width="290" height="78" fill="#ffffff" class="box"/>
  <text x="990" y="503" text-anchor="middle" class="boxText">Clear EXTI Flag</text>
  <text x="990" y="530" text-anchor="middle" class="smallText">write 1 to PR1 bit</text>

  <path d="M990 548 L990 590" class="line"/>
  <polygon points="990,590 1160,660 990,730 820,660" fill="#f4e5c7" class="box"/>
  <text x="990" y="650" text-anchor="middle" class="boxText">Pin is LOW?</text>
  <text x="990" y="679" text-anchor="middle" class="smallText">button pressed</text>

  <path d="M820 660 L775 660 L775 845 L845 845" class="line"/>
  <text x="790" y="642" text-anchor="middle" class="label">No</text>
  <rect x="845" y="810" width="290" height="78" fill="#f1dedb" class="box"/>
  <text x="990" y="842" text-anchor="middle" class="boxText">Release Detected</text>
  <text x="990" y="870" text-anchor="middle" class="smallText">active_note = -1</text>

  <path d="M990 730 L990 775" class="line"/>
  <text x="1010" y="757" class="label">Yes</text>
  <polygon points="990,775 1160,845 990,915 820,845" fill="#f4e5c7" class="box"/>
  <text x="990" y="835" text-anchor="middle" class="boxText">Debounce OK?</text>
  <text x="990" y="864" text-anchor="middle" class="smallText">50 ms check</text>

  <path d="M820 845 L775 845 L775 1035 L895 1035" class="line"/>
  <text x="790" y="828" text-anchor="middle" class="label">No</text>

  <path d="M990 915 L990 955" class="line"/>
  <text x="1012" y="940" class="label">Yes</text>
  <rect x="845" y="955" width="290" height="88" fill="#e4f0e8" class="box"/>
  <text x="990" y="990" text-anchor="middle" class="boxText">Save Active Note</text>
  <text x="990" y="1018" text-anchor="middle" class="smallText">active_note = button number</text>

  <path d="M990 1043 L990 1087" class="line"/>
  <path d="M990 888 L990 1087" class="line"/>
  <ellipse cx="990" cy="1128" rx="105" ry="40" fill="#dbeaf5" class="round"/>
  <text x="990" y="1135" text-anchor="middle" class="boxText">EXTI Exit</text>

  <!-- SysTick interrupt flow -->
  <ellipse cx="1515" cy="270" rx="125" ry="42" fill="#dbeaf5" class="round"/>
  <text x="1515" y="277" text-anchor="middle" class="boxText">SysTick Entry</text>

  <path d="M1515 312 L1515 350" class="line"/>
  <rect x="1360" y="350" width="310" height="82" fill="#ffffff" class="box"/>
  <text x="1515" y="384" text-anchor="middle" class="boxText">Interrupt Every Tick</text>
  <text x="1515" y="412" text-anchor="middle" class="smallText">20 kHz, 50 us per tick</text>

  <path d="M1515 432 L1515 470" class="line"/>
  <rect x="1360" y="470" width="310" height="78" fill="#ffffff" class="box"/>
  <text x="1515" y="503" text-anchor="middle" class="boxText">Update Milliseconds</text>
  <text x="1515" y="530" text-anchor="middle" class="smallText">20 ticks = 1 ms</text>

  <path d="M1515 548 L1515 590" class="line"/>
  <rect x="1342" y="590" width="346" height="88" fill="#ffffff" class="box"/>
  <text x="1515" y="625" text-anchor="middle" class="boxText">Check Each Speaker</text>
  <text x="1515" y="653" text-anchor="middle" class="smallText">PA5, PA6, PA7 use separate counters</text>

  <path d="M1515 678 L1515 725" class="line"/>
  <polygon points="1515,725 1690,795 1515,865 1340,795" fill="#f4e5c7" class="box"/>
  <text x="1515" y="787" text-anchor="middle" class="boxText">Half-period done?</text>
  <text x="1515" y="815" text-anchor="middle" class="smallText">counter &gt;= half value</text>

  <path d="M1690 795 L1720 795 L1720 940 L1658 940" class="line"/>
  <text x="1708" y="778" text-anchor="middle" class="label">Yes</text>
  <rect x="1375" y="905" width="280" height="78" fill="#dbeaf5" class="box"/>
  <text x="1515" y="937" text-anchor="middle" class="boxText">Toggle Phase</text>
  <text x="1515" y="965" text-anchor="middle" class="smallText">reset counter</text>

  <path d="M1340 795 L1305 795 L1305 1030 L1370 1030" class="line"/>
  <text x="1320" y="778" text-anchor="middle" class="label">No</text>
  <path d="M1515 865 L1515 905" class="line"/>
  <path d="M1515 983 L1515 1015" class="line"/>

  <polygon points="1515,1015 1680,1075 1515,1135 1350,1075" fill="#f4e5c7" class="box"/>
  <text x="1515" y="1068" text-anchor="middle" class="boxText">Output HIGH?</text>
  <text x="1515" y="1095" text-anchor="middle" class="smallText">count &lt; on-time</text>

  <path d="M1680 1075 L1718 1075 L1718 1160 L1638 1160" class="line"/>
  <text x="1704" y="1058" text-anchor="middle" class="label">Yes</text>
  <rect x="1390" y="1138" width="250" height="66" fill="#e4f0e8" class="box"/>
  <text x="1515" y="1165" text-anchor="middle" class="boxText">Set GPIO HIGH</text>
  <text x="1515" y="1190" text-anchor="middle" class="smallText">speaker on</text>

  <path d="M1350 1075 L1310 1075 L1310 1230 L1390 1230" class="line"/>
  <text x="1328" y="1058" text-anchor="middle" class="label">No</text>
  <rect x="1390" y="1210" width="250" height="66" fill="#f1dedb" class="box"/>
  <text x="1515" y="1237" text-anchor="middle" class="boxText">Set GPIO LOW</text>
  <text x="1515" y="1262" text-anchor="middle" class="smallText">speaker off</text>

  <path d="M1515 1276 L1515 1302" class="line"/>
  <ellipse cx="1515" cy="1318" rx="105" ry="30" fill="#dbeaf5" class="round"/>
  <text x="1515" y="1325" text-anchor="middle" class="boxText">Exit</text>

  <!-- Shared state notes -->
  <rect x="85" y="1360" width="505" height="88" class="dataBox"/>
  <text x="110" y="1390" class="noteText">Main variables:</text>
  <text x="245" y="1390" class="smallText">current_note, octave, volume</text>
  <text x="110" y="1420" class="tinyText">Main decides when to call Play_Tone() or Stop_Tone().</text>

  <rect x="765" y="1360" width="450" height="88" class="dataBox"/>
  <text x="790" y="1390" class="noteText">EXTI shares:</text>
  <text x="910" y="1390" class="smallText">active_note</text>
  <text x="790" y="1420" class="tinyText">The main loop reads this value after button interrupts.</text>

  <rect x="1270" y="1360" width="445" height="88" class="dataBox"/>
  <text x="1295" y="1390" class="noteText">SysTick uses:</text>
  <text x="1425" y="1390" class="smallText">half-periods and on-times</text>
  <text x="1295" y="1420" class="tinyText">These values control PA5, PA6, and PA7 waveforms.</text>
</svg>
