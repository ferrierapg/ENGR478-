<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f4f66"/>
    </marker>
    <style>
      .title { font: 700 52px Arial, sans-serif; fill: #17212b; }
      .subtitle { font: 400 23px Arial, sans-serif; fill: #5f6d7a; }
      .laneTitle { font: 700 27px Arial, sans-serif; fill: #17212b; }
      .boxText { font: 700 21px Arial, sans-serif; fill: #17212b; }
      .smallText { font: 400 18px Arial, sans-serif; fill: #17212b; }
      .tinyText { font: 400 16px Arial, sans-serif; fill: #4d5b66; }
      .noteText { font: 700 18px Arial, sans-serif; fill: #1f5e82; }
      .lane { fill: #f6f9fc; stroke: #c8d4df; stroke-width: 2; rx: 18; ry: 18; }
      .box { stroke: #1f4f66; stroke-width: 2.5; rx: 10; ry: 10; }
      .round { stroke: #1f4f66; stroke-width: 2.5; }
      .line { stroke: #1f4f66; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .returnLine { stroke: #73828f; stroke-width: 2.5; fill: none; marker-end: url(#arrow); stroke-dasharray: 8 7; }
      .dataLine { stroke: #2a836a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .label { font: 700 16px Arial, sans-serif; fill: #1f4f66; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1250" fill="#ffffff"/>
  <text x="70" y="76" class="title">Digital Piano Software Flowchart</text>
  <text x="70" y="112" class="subtitle">Main code, button EXTI interrupt, and SysTick sound interrupt are shown as separate flows.</text>

  <rect x="50" y="150" width="650" height="1035" class="lane"/>
  <text x="375" y="195" text-anchor="middle" class="laneTitle">Main Program Flow</text>

  <rect x="745" y="150" width="490" height="1035" class="lane"/>
  <text x="990" y="195" text-anchor="middle" class="laneTitle">Button EXTI Interrupt Flow</text>

  <rect x="1280" y="150" width="470" height="1035" class="lane"/>
  <text x="1515" y="195" text-anchor="middle" class="laneTitle">SysTick Interrupt Flow</text>

  <!-- Main flow -->
  <ellipse cx="375" cy="250" rx="135" ry="45" fill="#dbeaf5" class="round"/>
  <text x="375" y="257" text-anchor="middle" class="boxText">Start / Reset</text>

  <path d="M375 295 L375 335" class="line"/>

  <rect x="160" y="335" width="430" height="100" fill="#ffffff" class="box"/>
  <text x="375" y="370" text-anchor="middle" class="boxText">Initialize Peripherals</text>
  <text x="375" y="400" text-anchor="middle" class="smallText">GPIO outputs, EXTI inputs, ADC, SysTick</text>
  <text x="375" y="423" text-anchor="middle" class="tinyText">Then enable global interrupts</text>

  <path d="M375 435 L375 475" class="line"/>

  <rect x="205" y="475" width="340" height="85" fill="#e4f0e8" class="box"/>
  <text x="375" y="510" text-anchor="middle" class="boxText">Enter while(1)</text>
  <text x="375" y="538" text-anchor="middle" class="smallText">wait using __WFI()</text>

  <path d="M375 560 L375 600" class="line"/>

  <polygon points="375,600 570,680 375,760 180,680" fill="#f4e5c7" class="box"/>
  <text x="375" y="665" text-anchor="middle" class="boxText">20 ms passed?</text>
  <text x="375" y="695" text-anchor="middle" class="smallText">use SysTick_Millis()</text>

  <path d="M570 680 L640 680 L640 825 L555 825" class="line"/>
  <text x="598" y="665" text-anchor="middle" class="label">No</text>

  <path d="M375 760 L375 805" class="line"/>
  <text x="395" y="787" class="label">Yes</text>

  <rect x="150" y="805" width="450" height="105" fill="#ffffff" class="box"/>
  <text x="375" y="842" text-anchor="middle" class="boxText">Read ADC Knobs</text>
  <text x="375" y="872" text-anchor="middle" class="smallText">PA0 volume, PA1 octave</text>
  <text x="375" y="895" text-anchor="middle" class="tinyText">average samples for smoother readings</text>

  <path d="M375 910 L375 955" class="line"/>

  <polygon points="375,955 565,1030 375,1105 185,1030" fill="#dbeaf5" class="box"/>
  <text x="375" y="1018" text-anchor="middle" class="boxText">Button active?</text>
  <text x="375" y="1048" text-anchor="middle" class="smallText">Get_Active_Note()</text>

  <path d="M185 1030 L90 1030 L90 1085 L175 1085" class="line"/>
  <text x="132" y="1015" text-anchor="middle" class="label">No</text>

  <rect x="175" y="1140" width="245" height="85" fill="#f1dedb" class="box"/>
  <text x="298" y="1175" text-anchor="middle" class="boxText">Stop_Tone()</text>
  <text x="298" y="1203" text-anchor="middle" class="smallText">turn speaker pins off</text>

  <path d="M565 1030 L640 1030 L640 1135 L590 1135" class="line"/>
  <text x="607" y="1015" text-anchor="middle" class="label">Yes</text>

  <rect x="445" y="1095" width="220" height="90" fill="#dbeaf5" class="box"/>
  <text x="555" y="1128" text-anchor="middle" class="boxText">Calculate freq</text>
  <text x="555" y="1157" text-anchor="middle" class="smallText">note + octave knob</text>

  <path d="M555 1185 L555 1215 L445 1215 L445 1185" class="line"/>

  <rect x="445" y="1205" width="220" height="35" fill="#dbeaf5" stroke="#1f4f66" stroke-width="2.5"/>
  <text x="555" y="1229" text-anchor="middle" class="smallText">Play_Tone(freq)</text>

  <path d="M298 1140 C255 1045, 255 850, 318 755" class="returnLine"/>
  <path d="M555 1095 C610 960, 600 760, 505 706" class="returnLine"/>
  <path d="M375 475 C145 515, 115 735, 180 680" class="returnLine"/>

  <!-- EXTI interrupt flow -->
  <ellipse cx="990" cy="250" rx="115" ry="42" fill="#dbeaf5" class="round"/>
  <text x="990" y="257" text-anchor="middle" class="boxText">EXTI Entry</text>

  <path d="M990 292 L990 330" class="line"/>

  <rect x="825" y="330" width="330" height="85" fill="#ffffff" class="box"/>
  <text x="990" y="364" text-anchor="middle" class="boxText">Button Edge Occurs</text>
  <text x="990" y="392" text-anchor="middle" class="smallText">PC0, PC1, PC2, or PC3</text>

  <path d="M990 415 L990 455" class="line"/>

  <rect x="845" y="455" width="290" height="80" fill="#ffffff" class="box"/>
  <text x="990" y="488" text-anchor="middle" class="boxText">Clear EXTI Flag</text>
  <text x="990" y="515" text-anchor="middle" class="smallText">write 1 to PR1 bit</text>

  <path d="M990 535 L990 575" class="line"/>

  <polygon points="990,575 1160,645 990,715 820,645" fill="#f4e5c7" class="box"/>
  <text x="990" y="635" text-anchor="middle" class="boxText">Pin is LOW?</text>
  <text x="990" y="664" text-anchor="middle" class="smallText">button pressed</text>

  <path d="M820 645 L775 645 L775 785 L845 785" class="line"/>
  <text x="790" y="628" text-anchor="middle" class="label">No</text>

  <rect x="845" y="755" width="290" height="85" fill="#f1dedb" class="box"/>
  <text x="990" y="790" text-anchor="middle" class="boxText">Release Detected</text>
  <text x="990" y="818" text-anchor="middle" class="smallText">active_note = -1</text>

  <path d="M1160 645 L1205 645 L1205 785 L1135 785" class="line"/>
  <text x="1190" y="628" text-anchor="middle" class="label">Yes</text>

  <polygon points="990,730 1160,800 990,870 820,800" fill="#f4e5c7" class="box"/>
  <text x="990" y="790" text-anchor="middle" class="boxText">Debounce OK?</text>
  <text x="990" y="819" text-anchor="middle" class="smallText">50 ms check</text>

  <path d="M990 715 L990 730" class="line"/>

  <path d="M1160 800 L1205 800 L1205 905 L1135 905" class="line"/>
  <text x="1192" y="784" text-anchor="middle" class="label">Yes</text>

  <rect x="845" y="885" width="290" height="95" fill="#e4f0e8" class="box"/>
  <text x="990" y="922" text-anchor="middle" class="boxText">Save Active Note</text>
  <text x="990" y="952" text-anchor="middle" class="smallText">active_note = button number</text>

  <path d="M820 800 L775 800 L775 1030 L915 1030" class="line"/>
  <text x="790" y="782" text-anchor="middle" class="label">No</text>

  <path d="M990 840 L990 885" class="line"/>
  <path d="M990 980 L990 1020" class="line"/>
  <path d="M990 840 L990 1020" class="line"/>

  <ellipse cx="990" cy="1065" rx="105" ry="40" fill="#dbeaf5" class="round"/>
  <text x="990" y="1072" text-anchor="middle" class="boxText">EXTI Exit</text>

  <path d="M990 1020 L990 1025" class="line"/>
  <path d="M990 1105 C845 1135, 660 1040, 565 1030" class="dataLine"/>
  <text x="744" y="1102" class="tinyText">main loop reads active_note</text>

  <!-- SysTick interrupt flow -->
  <ellipse cx="1515" cy="250" rx="125" ry="42" fill="#dbeaf5" class="round"/>
  <text x="1515" y="257" text-anchor="middle" class="boxText">SysTick Entry</text>

  <path d="M1515 292 L1515 330" class="line"/>

  <rect x="1360" y="330" width="310" height="85" fill="#ffffff" class="box"/>
  <text x="1515" y="365" text-anchor="middle" class="boxText">Interrupt Every Tick</text>
  <text x="1515" y="393" text-anchor="middle" class="smallText">20 kHz, 50 us per tick</text>

  <path d="M1515 415 L1515 455" class="line"/>

  <rect x="1360" y="455" width="310" height="85" fill="#ffffff" class="box"/>
  <text x="1515" y="488" text-anchor="middle" class="boxText">Update Milliseconds</text>
  <text x="1515" y="516" text-anchor="middle" class="smallText">20 ticks = 1 ms</text>

  <path d="M1515 540 L1515 580" class="line"/>

  <rect x="1342" y="580" width="346" height="95" fill="#ffffff" class="box"/>
  <text x="1515" y="617" text-anchor="middle" class="boxText">Check Each Speaker</text>
  <text x="1515" y="646" text-anchor="middle" class="smallText">PA5, PA6, PA7 have their own counters</text>

  <path d="M1515 675 L1515 715" class="line"/>

  <polygon points="1515,715 1690,785 1515,855 1340,785" fill="#f4e5c7" class="box"/>
  <text x="1515" y="777" text-anchor="middle" class="boxText">Half-period done?</text>
  <text x="1515" y="805" text-anchor="middle" class="smallText">counter &gt;= half value</text>

  <path d="M1340 785 L1305 785 L1305 920 L1375 920" class="line"/>
  <text x="1318" y="768" text-anchor="middle" class="label">No</text>

  <path d="M1690 785 L1720 785 L1720 920 L1655 920" class="line"/>
  <text x="1710" y="768" text-anchor="middle" class="label">Yes</text>

  <rect x="1375" y="890" width="280" height="85" fill="#dbeaf5" class="box"/>
  <text x="1515" y="925" text-anchor="middle" class="boxText">Toggle Phase</text>
  <text x="1515" y="953" text-anchor="middle" class="smallText">reset counter to zero</text>

  <path d="M1515 855 L1515 890" class="line"/>
  <path d="M1515 975 L1515 1015" class="line"/>

  <polygon points="1515,1015 1680,1075 1515,1135 1350,1075" fill="#f4e5c7" class="box"/>
  <text x="1515" y="1068" text-anchor="middle" class="boxText">Output HIGH?</text>
  <text x="1515" y="1095" text-anchor="middle" class="smallText">phase high and count &lt; on-time</text>

  <path d="M1350 1075 L1300 1075 L1300 1160 L1395 1160" class="line"/>
  <text x="1320" y="1058" text-anchor="middle" class="label">No</text>

  <rect x="1395" y="1135" width="240" height="70" fill="#f1dedb" class="box"/>
  <text x="1515" y="1163" text-anchor="middle" class="boxText">Set GPIO LOW</text>
  <text x="1515" y="1188" text-anchor="middle" class="smallText">speaker off</text>

  <path d="M1680 1075 L1720 1075 L1720 1160 L1635 1160" class="line"/>
  <text x="1704" y="1058" text-anchor="middle" class="label">Yes</text>

  <rect x="1395" y="1040" width="240" height="70" fill="#e4f0e8" class="box"/>
  <text x="1515" y="1068" text-anchor="middle" class="boxText">Set GPIO HIGH</text>
  <text x="1515" y="1093" text-anchor="middle" class="smallText">speaker on</text>

  <path d="M1515 1205 L1515 1220" class="line"/>
  <ellipse cx="1515" cy="1225" rx="105" ry="35" fill="#dbeaf5" class="round"/>
  <text x="1515" y="1232" text-anchor="middle" class="boxText">Exit</text>

  <!-- Data notes -->
  <rect x="735" y="70" width="970" height="55" fill="#eef7f4" stroke="#94c8b5" stroke-width="2" rx="10" ry="10"/>
  <text x="760" y="104" class="noteText">Shared variables:</text>
  <text x="905" y="104" class="smallText">EXTI updates active_note. Main calls Play_Tone or Stop_Tone. SysTick uses half-period and volume values to drive PA5, PA6, PA7.</text>

  <path d="M665 1222 C905 1210, 1225 1125, 1395 1100" class="dataLine"/>
  <text x="965" y="1190" class="tinyText">Play_Tone loads half-periods and volume on-times used by SysTick</text>
</svg>
